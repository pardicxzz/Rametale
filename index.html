<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RameTale">
    <title>RameTale</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #controls {
            position: fixed;
            bottom: 8px;
            color: #444;
            font: 8px 'Press Start 2P', monospace;
            text-align: center;
        }

        /* ───────── MÓVIL ───────── */
        html, body { height: 100%; overscroll-behavior: none; }
        body.touch {
            height: 100dvh; min-height: 0; position: fixed; inset: 0; width: 100%;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; touch-action: none;
        }
        body.touch.portrait { justify-content: flex-start; padding-top: env(safe-area-inset-top); }
        body.touch #controls { display: none; }
        #touch { display: none; position: fixed; inset: 0; z-index: 500; pointer-events: none; font-family: 'Press Start 2P', monospace; }
        body.touch #touch { display: block; }
        #touch .pad, #touch .btn, #touch .mini { pointer-events: auto; touch-action: none; }
        #dpad {
            position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
            width: 148px; height: 148px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.10) 0 30%, rgba(255,255,255,0.05) 31% 100%);
            border: 2px solid rgba(255,255,255,0.28);
        }
        #dpad svg { width: 100%; height: 100%; display: block; }
        #dpad .arr { fill: rgba(255,255,255,0.42); transition: fill .05s; }
        #dpad .arr.on { fill: rgba(255,221,68,0.95); }
        #btnA {
            position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom));
            width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.45);
            background: rgba(220,60,60,0.38); color: rgba(255,255,255,0.9); font-size: 26px;
        }
        #btnA.on { background: rgba(255,221,68,0.6); transform: scale(0.94); }
        #topBtns { position: absolute; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 8px; }
        body.portrait #topBtns { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 170px); right: max(12px, env(safe-area-inset-right)); }
        #touch .mini {
            width: 42px; height: 42px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.35);
            background: rgba(0,0,0,0.45); color: #fff; font-size: 18px; line-height: 1;
        }
        /* ───────── PANTALLA DE CÓDIGO ───────── */
        #gate {
            display: none; position: fixed; inset: 0; z-index: 3000; background: #000; color: #fff;
            align-items: center; justify-content: center; padding: 20px;
            font-family: 'Press Start 2P', monospace; transition: opacity .35s;
        }
        #gate.out { opacity: 0; pointer-events: none; }
        #gate .box { width: min(440px, 100%); text-align: center; border: 3px solid #fff; padding: 26px 20px 20px; background: #05050a; }
        #gate h1 { font-size: 22px; letter-spacing: 3px; margin-bottom: 8px; color: #ffdd44; }
        #gate p { font-size: 10px; line-height: 1.9; color: #cde; margin: 12px 0 14px; }
        #gate input {
            width: 100%; padding: 14px 8px; font: 15px 'Press Start 2P', monospace; text-align: center; letter-spacing: 2px;
            color: #fff; background: #000; border: 3px solid #5cf; border-radius: 0; outline: none; text-transform: uppercase;
            -webkit-user-select: text; user-select: text; touch-action: manipulation;
        }
        #gate input:focus { border-color: #ffdd44; }
        #gate button {
            margin-top: 14px; width: 100%; padding: 14px 8px; font: 12px 'Press Start 2P', monospace; color: #000;
            background: #ffdd44; border: 3px solid #fff; cursor: pointer; touch-action: manipulation;
        }
        #gate button:disabled { background: #665; color: #333; cursor: default; }
        #gateMsg { min-height: 34px; margin-top: 14px; font-size: 9px; line-height: 1.8; color: #ff7a7a; }
        #gateMsg.ok { color: #7aff9a; }
        #gate small { display: block; margin-top: 8px; font-size: 8px; line-height: 1.8; color: #789; }
        /* aviso para girar el teléfono */
        #rotate {
            display: none; position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,0.92); color: #fff;
            flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
            font: 11px/1.8 'Press Start 2P', monospace;
        }
        #rotate .ic { font-size: 54px; animation: rot 2s ease-in-out infinite; }
        @keyframes rot { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
        #rotate button { margin-top: 6px; padding: 12px 16px; font: 10px 'Press Start 2P', monospace; color: #fff; background: #1c3350; border: 2px solid #5cf; border-radius: 6px; }
    </style>
</head>
<body>
    <canvas id="game" width="640" height="480"></canvas>
    <div id="controls">Flechas/WASD: Mover &nbsp;|&nbsp; Z/Enter: Interactuar</div>
    <div id="touch">
        <div id="dpad" class="pad">
            <svg viewBox="0 0 148 148">
                <polygon class="arr" data-d="U" points="74,16 94,44 54,44"/>
                <polygon class="arr" data-d="D" points="74,132 94,104 54,104"/>
                <polygon class="arr" data-d="L" points="16,74 44,54 44,94"/>
                <polygon class="arr" data-d="R" points="132,74 104,54 104,94"/>
            </svg>
        </div>
        <button id="btnA" class="btn" aria-label="Acción">A</button>
        <div id="topBtns">
            <button id="btnMute" class="mini" aria-label="Sonido">🔊</button>
            <button id="btnFs" class="mini" aria-label="Pantalla completa">⛶</button>
        </div>
    </div>
    <div id="gate">
        <div class="box">
            <h1>RAMETALE</h1>
            <p>Escribe tu código<br>de acceso</p>
            <input id="gateCode" type="text" maxlength="14" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Código de acceso">
            <button id="gateGo" type="button">ENTRAR</button>
            <div id="gateMsg"></div>
            <small>Cada código solo se puede usar una vez.</small>
        </div>
    </div>
    <div id="rotate">
        <div class="ic">📱</div>
        <div>Gira el teléfono<br>para jugar mejor</div>
        <button id="rotateGo">JUGAR ASÍ</button>
    </div>
    <script>
    'use strict';
    // ================================================================
    //  ★  R A M E T A L E  —  Motor de Exploración v1.0
    //  Un RPG educativo inspirado en Undertale
    //  Materias: Matemáticas · Lenguaje · Historia · Ciencias
    // ================================================================

    // ──────────────── Canvas ────────────────
    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');
    const CW = 640, CH = 480, TILE = 32;

    // ════════════════ ACCESO CON CÓDIGO ════════════════
    // Pega aquí la dirección de tu Apps Script (la que termina en /exec).
    // Si lo dejas vacío, el juego se abre directo, sin pedir código.
    const ACCESS_URL = 'https://script.google.com/macros/s/AKfycbxggRLfJ7GEcYNiPDI6eQJ2VXiUKNQtaoUJzKbw9Ju-cLTsRw7Xcpp1odqKaPWjlWtNRg/exec';
    let gateActive = !!ACCESS_URL;       // mientras es true, el juego ignora el teclado y los toques

    // ¿Pantalla táctil? (también se puede forzar con  ?touch=1  en la dirección)
    const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || /[?&]touch=1/.test(location.search);
    if (IS_TOUCH) document.body.classList.add('touch');

    function resize() {
        const vw = innerWidth, vh = innerHeight;
        const portrait = IS_TOUCH && vh > vw;
        // vertical: el juego queda arriba y los controles abajo · horizontal: el juego ocupa todo el alto
        let s = portrait ? Math.min(vw / CW, (vh * 0.66) / CH) : Math.min(vw / CW, vh / CH);
        s = Math.floor(s * 100) / 100;
        canvas.style.width  = (CW * s) + 'px';
        canvas.style.height = (CH * s) + 'px';
        document.body.classList.toggle('portrait', portrait);
        const rot = document.getElementById('rotate');
        if (rot) rot.style.display = (portrait && !rotateDismissed) ? 'flex' : 'none';
    }
    let rotateDismissed = false;
    resize();
    addEventListener('resize', resize);
    addEventListener('orientationchange', () => setTimeout(resize, 200));
    if (window.visualViewport) visualViewport.addEventListener('resize', resize);

    // ──────────────── Input ────────────────
    const keys = {};
    let interact = false;
    let navUp = false, navDown = false, navLeft = false, navRight = false;

    // Pila de direcciones: la última tecla presionada manda sobre el sprite
    // (0:Arriba, 1:Abajo, 2:Izquierda, 3:Derecha)
    const DIR_KEYS = {
        ArrowUp:0, KeyW:0, ArrowDown:1, KeyS:1,
        ArrowLeft:2, KeyA:2, ArrowRight:3, KeyD:3
    };
    let dirStack = [];
    let debugSprites = false;

    function dirStillHeld(d) {
        for (const code in DIR_KEYS) if (DIR_KEYS[code] === d && keys[code]) return true;
        return false;
    }

    addEventListener('keydown', e => {
        if (devKeyHook(e)) return;   // el panel DEV usa sus propios controles
        if (e.code === 'F3') { debugSprites = !debugSprites; e.preventDefault(); }
        if (!keys[e.code]) {
            if (e.code in DIR_KEYS) {
                const d = DIR_KEYS[e.code];
                dirStack = dirStack.filter(x => x !== d);
                dirStack.push(d);
            }
            if (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space') {
                interact = true;
                // reintenta reproducir música si el navegador bloqueó el autoplay inicial
                if (currentMusicKey && musicEls[currentMusicKey] && musicEls[currentMusicKey].paused) {
                    musicEls[currentMusicKey].play().catch(() => {});
                }
            }
            if (e.code === 'ArrowUp'    || e.code === 'KeyW') navUp    = true;
            if (e.code === 'ArrowDown'  || e.code === 'KeyS') navDown  = true;
            if (e.code === 'ArrowLeft'  || e.code === 'KeyA') navLeft  = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') navRight = true;
        }
        keys[e.code] = true;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
             'Space','KeyZ','Enter'].includes(e.code))
            e.preventDefault();
    });
    addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code in DIR_KEYS) dirStack = dirStack.filter(dirStillHeld);
    });
    // Si la ventana pierde el foco, soltar todas las teclas (evita direcciones "pegadas")
    addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
        dirStack = [];
    });

    // ──────────────── Recursos ────────────────
    const images = {};
    const imageSources = {};
    // La hoja tiene 20 sprites: sprite_01.png ... sprite_20.png  (player_0 ... player_19)
    for (let i = 1; i <= 20; i++)
        imageSources['player_' + (i - 1)] = 'Sprites/sprite_' + String(i).padStart(2, '0') + '.png';

    let imagesLoaded = 0;
    const totalImages = Object.keys(imageSources).length;

    for (const key in imageSources) {
        const img = new Image();
        img.src = imageSources[key];
        img.onload = () => {
            imagesLoaded++;
            if (imagesLoaded === totalImages) {
                console.log('Todos los sprites cargados');
            }
        };
        images[key] = img;
    }

    // ──────────────── Constantes ────────────────
    const SPEED      = 140;   // px/s
    const ANIM_SPEED = 8;     // cuadros de animación por segundo
    const PW = 10, PH = 8;   // mitad del ancho/alto de la colisión

    // Configuración del Sprite del Jugador
    const PLAYER_SPRITE = {
        height: 44    // alto en pantalla del personaje (el ancho se calcula solo, sin deformar)
    };
    const SPRITE_REF_H = 209;  // alto original de los sprites de caminata (px)

    // ★ TABLA DE SPRITES ★  (sprite_01.png = 1 ... sprite_20.png = 20)
    // Según los sprites reales: 1-4 de frente · izquierda = 5, 6 y 14 · derecha = 8, 9, 10
    // · 11-13 de espaldas · 15-20 expresiones (no se usan al caminar)
    // Si falta algún archivo, se salta solo y la animación usa los que sí existan.
    const SPRITE_MAP = {
        0: [11, 12, 13],       // Arriba (espalda)
        1: [ 1,  2,  3,  4],   // Abajo (frente)
        2: [ 5,  6, 14],       // Izquierda (el 7 NO se usa: mira a la derecha)
        3: [ 8,  9, 10]        // Derecha
    };

    const spriteCache = {};
    // Escala cada sprite UNA vez al mismo factor, así todos quedan del mismo tamaño
    function getPlayerSprite(num) {
        if (spriteCache[num]) return spriteCache[num];
        const img = images['player_' + (num - 1)];
        if (!img || !img.complete || img.naturalWidth === 0) return null;
        const sc = PLAYER_SPRITE.height / SPRITE_REF_H;
        const w = Math.max(1, Math.round(img.naturalWidth  * sc));
        const h = Math.max(1, Math.round(img.naturalHeight * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        g.drawImage(img, 0, 0, w, h);
        spriteCache[num] = c;
        return c;
    }

    // Número de sprite para una dirección y cuadro (0 = reposo). Ignora los archivos que no carguen.
    function playerSpriteNumber(dir, frame) {
        const list = (SPRITE_MAP[dir] || SPRITE_MAP[1]).filter(n => getPlayerSprite(n));
        if (!list.length) return null;
        return list[((frame % list.length) + list.length) % list.length];
    }
    const FLOOR = 0, WALL = 1, DOOR = 2, DESK = 3,
          BOARD = 4, LOCKER = 5, SHELF = 6, LAB_T = 7, PLANT = 8, PILLAR = 9;
    const SOLID_SET = new Set([WALL, DESK, BOARD, LOCKER, SHELF, LAB_T, PLANT, PILLAR]);
    const TILE_CHARS = {
        '.': FLOOR, 'W': WALL, 'D': DOOR, 'd': DESK,
        'B': BOARD, 'L': LOCKER, 'S': SHELF, 'T': LAB_T, 'P': PLANT, '#': PILLAR
    };

    // ──────────────── Paleta de colores por zona ────────────────
    const THEMES = {
        hallway:  { f1:'#3a3a5c', f2:'#36365a', w:'#1a1a2e', wt:'#2a2a4e', ac:'#e6c86e', dr:'#8b7355' },
        math:     { f1:'#2a3a6c', f2:'#263565', w:'#1a2a4e', wt:'#1a3a6e', ac:'#4a9ef5', dr:'#4a7ab5' },
        language: { f1:'#2a5c3a', f2:'#265a35', w:'#1a4e2a', wt:'#1a6e3a', ac:'#4af57a', dr:'#3ab55a' },
        history:  { f1:'#5c4a2a', f2:'#5a4525', w:'#4e3a1a', wt:'#6e4a1a', ac:'#f5a44a', dr:'#b57a3a' },
        science:  { f1:'#4a2a5c', f2:'#45255a', w:'#3a1a4e', wt:'#5a2a7e', ac:'#b44af5', dr:'#8a3ab5' },
        sanctum:  { f1:'#181022', f2:'#140e1c', w:'#0a0612', wt:'#241636', ac:'#e64ae6', dr:'#5a2a7e' }
    };

    // ════════════════════════════════════════════════════════════════
    //  MUNDO AMPLIADO · parte A: casillas nuevas, temas, preguntas, sellos
    // ════════════════════════════════════════════════════════════════
    const T_GRASS = 10, T_PATH = 11, T_ROAD = 12, T_ROADLINE = 13, T_TREE = 14, T_FLOWER = 15, T_WATER = 16,
          T_FENCE = 17, T_BENCH = 18, T_HOUSE = 19, T_ROOF = 20, T_CARPET = 21, T_TABLE = 22, T_COUNTER = 23,
          T_BED = 24, T_FOUNTAIN = 25, T_SAND = 26, T_CRATE = 27, T_STAIRS = 28, T_LAMP = 29, T_ROCK = 30,
          T_BUSH = 31, T_SIGN = 32, T_HDOOR = 33;
    [T_TREE, T_WATER, T_FENCE, T_BENCH, T_HOUSE, T_ROOF, T_TABLE, T_COUNTER, T_BED, T_FOUNTAIN, T_CRATE,
     T_LAMP, T_ROCK, T_BUSH, T_SIGN, T_HDOOR].forEach(t => SOLID_SET.add(t));
    Object.assign(TILE_CHARS, {
        g:T_GRASS, p:T_PATH, R:T_ROAD, Z:T_ROADLINE, Y:T_TREE, f:T_FLOWER, '~':T_WATER, F:T_FENCE, b:T_BENCH,
        H:T_HOUSE, h:T_ROOF, c:T_CARPET, t:T_TABLE, C:T_COUNTER, E:T_BED, O:T_FOUNTAIN, s:T_SAND, X:T_CRATE,
        U:T_STAIRS, l:T_LAMP, r:T_ROCK, u:T_BUSH, N:T_SIGN, k:T_HDOOR
    });
    Object.assign(THEMES, {
        outdoor: { f1:'#bfb08e', f2:'#b8a986', w:'#3a3a44', wt:'#4a4a56', ac:'#f5d76e', dr:'#8a5a2a' },
        hall:    { f1:'#4a4560', f2:'#464060', w:'#241f36', wt:'#352d52', ac:'#f5d76e', dr:'#8a6a3a' },
        cafe:    { f1:'#6a5a44', f2:'#665640', w:'#3a2c1c', wt:'#5a4228', ac:'#f5a050', dr:'#9a6a3a' },
        library: { f1:'#4a3a2e', f2:'#463628', w:'#2a1e16', wt:'#4a3424', ac:'#e8c070', dr:'#7a5230' },
        gym:     { f1:'#9a7a4a', f2:'#947444', w:'#4a3a24', wt:'#6a5030', ac:'#ff9a4a', dr:'#a05a2a' },
        infirm:  { f1:'#8aa8a0', f2:'#84a29a', w:'#4a6a62', wt:'#5a8078', ac:'#7af0c8', dr:'#5a8a80' }
    });

    // ---- dibujo de las casillas nuevas (las anteriores las dibuja drawTileBase) ----
    function hash2(x, y) {
        let h = (x * 374761393 + y * 668265263) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function drawTile(type, tx, ty, x, y) {
        if (type < 10) return drawTileBase(type, tx, ty, x, y);
        const S = TILE, c = ctx, r = hash2(tx, ty), chk = (tx + ty) % 2;
        const grass = () => {
            c.fillStyle = chk ? '#3e8e48' : '#3a8844'; c.fillRect(x, y, S, S);
            c.fillStyle = '#4aa055';
            c.fillRect(x + 3 + Math.floor(r * 23), y + 4 + Math.floor(r * 77) % 20, 2, 3);
            c.fillRect(x + 6 + Math.floor(r * 91) % 20, y + 6 + Math.floor(r * 53) % 18, 2, 3);
        };
        const path = () => {
            c.fillStyle = chk ? '#bfb08e' : '#b8a986'; c.fillRect(x, y, S, S);
            c.fillStyle = 'rgba(0,0,0,0.07)'; c.fillRect(x, y, S, 1); c.fillRect(x, y, 1, S);
            if (r < 0.4) { c.fillStyle = '#a89a78'; c.fillRect(x + 6 + Math.floor(r * 40), y + 9, 3, 2); }
        };
        const floor = () => { c.fillStyle = chk ? theme.f1 : theme.f2; c.fillRect(x, y, S, S); };
        const shadow = (cx, cy, rx, ry) => { c.fillStyle = 'rgba(0,0,0,0.22)'; c.beginPath(); c.ellipse(x + cx, y + cy, rx, ry, 0, 0, 7); c.fill(); };
        switch (type) {
            case T_GRASS: grass(); break;
            case T_PATH:  path(); break;
            case T_ROAD:
                c.fillStyle = chk ? '#40424c' : '#3c3e48'; c.fillRect(x, y, S, S);
                if (r < 0.3) { c.fillStyle = '#4c4e5a'; c.fillRect(x + 8, y + 12, 4, 2); }
                break;
            case T_ROADLINE:
                c.fillStyle = '#40424c'; c.fillRect(x, y, S, S);
                if (tx % 2 === 0) { c.fillStyle = '#e8c840'; c.fillRect(x + 3, y + 14, 26, 4); }
                break;
            case T_TREE:
                grass(); shadow(16, 29, 13, 4);
                c.fillStyle = '#5a3a1e'; c.fillRect(x + 13, y + 17, 6, 14);
                c.fillStyle = '#1f6a2e'; c.beginPath(); c.ellipse(x + 16, y + 11, 15, 13, 0, 0, 7); c.fill();
                c.fillStyle = '#2a8a3a'; c.beginPath(); c.ellipse(x + 12, y + 8, 8, 6, 0, 0, 7); c.fill();
                c.fillStyle = '#3aa04a'; c.fillRect(x + 8, y + 5, 4, 3);
                break;
            case T_FLOWER: {
                grass();
                const cols = ['#f0d040', '#f06a8a', '#ffffff', '#a070f0'];
                for (let i = 0; i < 3; i++) {
                    c.fillStyle = cols[Math.floor(hash2(tx + i * 7, ty - i * 3) * 4)];
                    c.fillRect(x + 4 + Math.floor(hash2(tx, ty + i) * 22), y + 6 + Math.floor(hash2(tx + i, ty) * 18), 3, 3);
                }
                break;
            }
            case T_WATER: {
                const o = Math.sin(performance.now() / 500 + tx * 0.7) * 3;
                c.fillStyle = chk ? '#2a6aa8' : '#2766a2'; c.fillRect(x, y, S, S);
                c.fillStyle = '#4a8ad0'; c.fillRect(x + 4 + o, y + 9, 10, 2); c.fillRect(x + 16 - o, y + 21, 10, 2);
                break;
            }
            case T_FENCE:
                grass();
                c.fillStyle = '#4a4a56'; c.fillRect(x, y + 10, S, 3); c.fillRect(x, y + 20, S, 3);

    function pickQuestions(def) {
        const bank = QB[def.subject] || QB.math, tier = def.tier || 1;
        const n = def.nq || ({ 1:3, 2:3, 3:4, 4:5 }[tier] || 3);
        const take = pool => pool.slice().sort(() => Math.random() - 0.5);
        let list = take(bank.filter(q => q.t === tier));
        if (list.length < n) list = list.concat(take(bank.filter(q => q.t === tier - 1 || q.t === tier + 1)));
        return list.slice(0, n);
    }

    // ════════════════════════════════════════════════════════════════
    //  MUNDO AMPLIADO · parte B: herramientas para construir mapas + todas las zonas nuevas
    //  (Las zonas se generan al cargar el juego con un generador con semilla fija: son siempre iguales.)
    // ════════════════════════════════════════════════════════════════
    (function buildWorld() {
        // ---------- cuadrícula ----------
        const G = (w, h, ch) => Array.from({ length: h }, () => new Array(w).fill(ch));
        const gSet = (g, x, y, ch) => { if (g[y] && x >= 0 && x < g[0].length) g[y][x] = ch; };
        const gFill = (g, x, y, w, h, ch) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) gSet(g, i, j, ch); };
        const gBox = (g, x, y, w, h, ch) => { gFill(g, x, y, w, 1, ch); gFill(g, x, y + h - 1, w, 1, ch); gFill(g, x, y, 1, h, ch); gFill(g, x + w - 1, y, 1, h, ch); };
        function rng(seed) {
            let a = seed | 0;
            return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        }
        const rint = (R, a, b) => a + Math.floor(R() * (b - a + 1));
        function gScatter(g, R, ch, n, on) {
            const h = g.length, w = g[0].length; let tries = n * 30;
            while (n > 0 && tries-- > 0) { const x = rint(R, 0, w - 1), y = rint(R, 0, h - 1); if (g[y][x] === on) { g[y][x] = ch; n--; } }
        }
        function gEllipse(g, cx, cy, rx, ry, ch, R, jag) {
            for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
                const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2;
                if (d <= 1 + (jag ? (R() - 0.5) * jag : 0)) gSet(g, x, y, ch);
            }
        }

        // ---------- registro de mapas ----------
        const B = {};
        const WALK = new Set('.gpfscRZUE'.split('').filter(c => c !== 'E'));
        function newMap(id, name, theme, w, h, fill, wall) {
            const g = G(w, h, fill);
            if (wall) gBox(g, 0, 0, w, h, wall);
            return (B[id] = { id, name, theme, w, h, g, base: fill, cv: fill === 'g' ? 'p' : fill, trans: [], npcs: [], out: fill === 'g', foes: 0 });
        }
        function adopt(id) {
            const m = MAPS[id], g = m.tiles.map(r => [...r]);
            return (B[id] = { id, name: m.name, theme: m.theme, w: g[0].length, h: g.length, g, base: '.', cv: '.', trans: [], npcs: [], out: false, foes: 0, old: true });
        }
        const isBorder = (b, x, y) => x <= 0 || y <= 0 || x >= b.w - 1 || y >= b.h - 1;
        function carve(b, x, y, r) {   // abre hueco (solo donde hay obstáculos) sin tocar el borde del mapa
            for (let j = y - r; j <= y + r; j++) for (let i = x - r; i <= x + r; i++) {
                if (i < 0 || j < 0 || i >= b.w || j >= b.h || isBorder(b, i, j)) continue;
                if (!WALK.has(b.g[j][i])) b.g[j][i] = b.cv;
            }
        }
        const SIDE = {
            N: b => p => ({ x:p, y:0,       sx:p,       sy:1,       dx:0,  dy:1  }),
            S: b => p => ({ x:p, y:b.h - 1, sx:p,       sy:b.h - 2, dx:0,  dy:-1 }),
            W: b => p => ({ x:0, y:p,       sx:1,       sy:p,       dx:1,  dy:0  }),
            E: b => p => ({ x:b.w - 1, y:p, sx:b.w - 2, sy:p,       dx:-1, dy:0  })
        };
        function openDoor(b, side, pos, k, ch) {   // devuelve datos de la puerta k-ésima de un tramo
            const horiz = side === 'N' || side === 'S';
            const d = SIDE[side](b)(pos + (horiz ? k : 0));
            if (!horiz) { d.y += k; d.sy += k; }
            gSet(b.g, d.x, d.y, ch);
            for (let s = 1; s <= 3; s++) { const x = d.x + d.dx * s, y = d.y + d.dy * s; if (!isBorder(b, x, y) || b.out) gSet(b.g, x, y, b.cv); }
            // el borde de los mapas exteriores también se abre para dejar pasar
            return d;
        }
        // Une dos mapas por sus paredes. ga/gb = carácter de la puerta ('D' puerta, 'p' portón abierto)
        function link(aId, aSide, aPos, bId, bSide, bPos, o = {}) {
            const A = B[aId], Bm = B[bId], span = o.span || 1, ga = o.ga || 'D', gb = o.gb || 'D';
            for (let k = 0; k < span; k++) {
                const a = openDoor(A, aSide, aPos, k, ga), b = openDoor(Bm, bSide, bPos, k, gb);
                A.trans.push({ x:a.x, y:a.y, map:bId, sx:b.sx, sy:b.sy, ...(ga !== 'D' ? { arrow:aSide } : {}) });
                Bm.trans.push({ x:b.x, y:b.y, map:aId, sx:a.sx, sy:a.sy, ...(gb !== 'D' ? { arrow:bSide } : {}) });
            }
        }
        // Puerta en medio de un mapa exterior (fachada de un edificio): (x,y) = casilla de la puerta, el jugador sale al sur
        function linkFacade(aId, x, y, bId, bSide, bPos) {
            const A = B[aId], Bm = B[bId];

        const GEN = { hair:'#444455', skin:'#d8c8b8', shirt:'#5a6a8a', pants:'#33384a' };

            'Hipotenusa Hambrienta':{ s:'math', t:4, mini:1 },

        function addFoe(id, x, y, name, o = {}) {
            const b = B[id], r = ROSTER[name]; carve(b, x, y, 1);
            const subject = r.s || o.s || SUBJ[(x * 7 + y * 3) % 4];
            const def = { id:`${id}#f${b.foes++}`, type:'enemy', tx:x, ty:y, name, dir:'down', colors:GEN,
                          subject, tier:r.t, hp:HP_BY_TIER[r.t] };
            
            if (r.mini) { def.mini = true; def.seal = subject; def.hard = true; }
            if (o.hard) def.hard = true;
            b.npcs.push(def);
        }
        // Reparte enemigos en puntos libres (lejos de puertas, paredes y entre sí)
        function scatterFoes(id, R, names, o = {}) {
            const b = B[id], pts = [], minD = o.min || 5;
            const avoid = [...b.trans.map(t => [t.x, t.y, 4]), ...b.npcs.map(n => [n.tx, n.ty, 3])];
            const open = (x, y) => { for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const c = (b.g[y + j] || [])[x + i]; if (!WALK.has(c)) return false; } return true; };
            for (const name of names) {
                for (let tries = 0; tries < 3000; tries++) {
                    const x = rint(R, 3, b.w - 4), y = rint(R, 3, b.h - 4);
                    if (!open(x, y)) continue;
                    if (avoid.some(([ax, ay, d]) => Math.max(Math.abs(ax - x), Math.abs(ay - y)) < d)) continue;
                    if (pts.some(([px, py]) => Math.max(Math.abs(px - x), Math.abs(py - y)) < minD)) continue;
                    pts.push([x, y]); addFoe(id, x, y, name, o); break;
                }
            }
        }

        // ---------- decoración de salas interiores ----------
        function deco(b, kind, R) {
            const g = b.g, w = b.w, h = b.h;
            switch (kind) {
                case 'corridor':
                    for (let x = 2; x < w - 2; x++) if (x % 9 !== 4) { gSet(g, x, 1, 'L'); gSet(g, x, h - 2, 'L'); }
                    for (let x = 7; x < w - 5; x += 8) { gSet(g, x, Math.floor(h / 2), '#'); gSet(g, x + 3, 4, 'P'); gSet(g, x + 3, h - 5, 'P'); }
                    break;
                case 'shelves':
                    for (let x = 2; x < w - 2; x++) if (x % 8 !== 3) gSet(g, x, 1, 'S');
                    for (let x = 7; x < w - 5; x += 8) { gSet(g, x, Math.floor(h / 2), '#'); gSet(g, x + 3, h - 5, 'P'); gSet(g, x + 3, 4, 'P'); }
                    break;
                case 'class':
                    for (let x = 3; x < w - 3; x++) if (x % 12 !== 6) gSet(g, x, 1, 'B');
                    for (let y = 5; y < h - 3; y += 3) for (let x = 5; x < w - 7; x += 6) { gSet(g, x, y, 'd'); gSet(g, x + 1, y, 'd'); }
                    break;
                case 'lab':
                    for (let y = 4; y < h - 3; y += 4) for (let x = 5; x < w - 8; x += 7) { gSet(g, x, y, 'T'); gSet(g, x + 1, y, 'T'); gSet(g, x + 2, y, 'T'); }
                    for (let x = 2; x < w - 2; x += 5) gSet(g, x, 1, 'S');
                    break;
                case 'puzzle':
                    for (let y = 4; y < h - 3; y += 5) for (let x = 6; x < w - 5; x += 6) gSet(g, x, y, '#');
                    for (let x = 3; x < w - 3; x += 7) { gSet(g, x, 1, 'B'); gSet(g, x + 1, 1, 'B'); }
                    break;
                case 'museum':
                    gFill(g, 3, Math.floor(h / 2), w - 6, 1, 'c');
                    for (let x = 4; x < w - 4; x += 5) { gSet(g, x, 5, '#'); gSet(g, x, h - 6, '#'); }
                    for (let x = 3; x < w - 3; x++) if (x % 7 !== 3) gSet(g, x, 1, 'S');
                    break;
                case 'library':
                    for (let x = 6; x < w - 4; x += 6) for (let y = 3; y < h - 3; y++) if ((y + x) % 8 !== 0) gSet(g, x, y, 'S');
                    break;
                case 'arena':
                    for (const [x, y] of [[4, 3], [w - 5, 3], [4, h - 4], [w - 5, h - 4], [Math.floor(w / 2), 3]]) gSet(g, x, y, '#');
                    gFill(g, 6, Math.floor(h / 2), w - 12, 1, 'c');
                    break;
            }
        }
        function room(id, name, theme, w, h, kind, seed) {
            const b = newMap(id, name, theme, w, h, '.', 'W');

        function outdoor(id, name, w, h, seed, dens) {
            const b = newMap(id, name, 'outdoor', w, h, 'g'), R = rng(seed), g = b.g;

            gScatter(g, R, 'r', Math.floor(w * h * 0.002), 'g'); gScatter(g, R, 'Y', Math.floor(w * h * (dens || 0.02)), 'g');
            for (let x = 0; x < w; x++) for (const y of [0, 1, h - 2, h - 1]) gSet(g, x, y, R() < 0.93 ? 'Y' : 'g');
            for (let y = 0; y < h; y++) for (const x of [0, 1, w - 2, w - 1]) gSet(g, x, y, R() < 0.93 ? 'Y' : 'g');
            return { b, R, g };
        }

    const charImages = {};
    for (const key in CHAR_EMBEDDED) {
        const img = new Image();
        img.src = CHAR_EMBEDDED[key];
        charImages[key] = img;
    }
    // Devuelve la imagen lista del personaje (si no tiene esa dirección, usa la de frente)
    function charImgReady(name, dir = 'down') {
        const im = charImages[name + '|' + dir] || charImages[name + '|down'];
        return (im && im.complete && im.naturalWidth > 0) ? im : null;
    }

    // Dibuja el NPC/enemigo en el mapa a tamaño real, con los pies en el mismo punto que el protagonista.
    // Devuelve false si no hay imagen.
    function drawCharImage(n, x, y) {
        const im = charImgReady(n.name, n.dir);
        if (!im) return false;
        ctx.drawImage(im, Math.round(x + 16 - im.naturalWidth / 2), Math.round(y + 32 - im.naturalHeight));
        return true;
    }

    // Casilla donde apareces al cambiar de mapa: su puerta no se activa hasta que te muevas de ahí
    let doorLock = null;
    const player = { x:0, y:0, dir:1, moving:false, animTimer:0, frame:0, hp:100, maxHp:100 };
    const camera = { x:0, y:0 };

    // Diálogo
    const dlg = { active:false, speaker:'', lines:[], li:0, ci:0, timer:0, onDone:null };

    // Transición (fundido)
    const fade = { alpha:0, dir:0, cb:null };

    // ──────────────── Combate ────────────────
    const SUBJECT_NAMES = { math:'Matemáticas', language:'Lenguaje', history:'Historia', science:'Ciencias' };
    const SUBJECT_ICON  = { math:'Σ', language:'A', history:'⌛', science:'⚗' };
    const BATTLE_MENU   = ['ATACAR', 'ACTUAR', 'ITEM', 'PERDONAR'];
    const WRONG_DMG_TABLE = [0, 8, 18, 30, 45]; // índice = # de preguntas falladas
    const ITEM_HEAL     = 15;
    const DODGE_TIME    = 4.5;

    const defeatedIds = {}; // enemigos ya derrotados (persisten entre salas)
    const ENEMY_IDS   = ['math_boss', 'lang_boss', 'hist_boss', 'sci_boss']; // solo los Guardianes cuentan para el final
    function allDefeated() { return ENEMY_IDS.every(id => defeatedIds[id]); }
    let endingPlayed = false;

    const CLASSROOM_IDS = ['math', 'language', 'history', 'science'];
    const visitedRooms   = new Set();
    function allRoomsVisited() { return CLASSROOM_IDS.every(id => visitedRooms.has(id)); }

    // ──────────────── Música ────────────────
    const MUSIC_SRC = {
        start:      'audio/002_start_menu.mp3',       // pantalla de título
        intro:      'audio/001_once_upon_a_time.mp3',  // lore inicial
        ambient:    'audio/005_ruins.mp3',             // pasillo y aulas
        sanctum:    'audio/028_premonition.mp3',       // Sala de los Guardianes y guaridas
        battle:     'audio/enemy_approaching.mp3',     // enemigos comunes
        bossBattle: 'audio/089_save_the_world.mp3',    // peleas contra Guardianes
        finale:     'audio/072_fight_sans.mp3'         // tras derrotar a los 4 Guardianes (para siempre)
    };
    const musicEls = {};
    for (const key in MUSIC_SRC) {
        const a = new Audio(MUSIC_SRC[key]);
        a.loop = true;
        a.volume = 0.55;
        musicEls[key] = a;
    }
    let currentMusicKey = null;
    let musicLocked = false; // true cuando suena la música final: ya no se puede interrumpir
    // true desde la primera pelea contra un Guardián: "SAVE the World" sigue sonando sin
    // cortarse (ni al ganar, ni al cambiar de sala, ni en peleas comunes) hasta que los
    // 4 Guardianes estén derrotados y empiece la música final.
    let guardianMusic = false;

    function playMusic(key) {
        if (musicLocked) return;
        if (guardianMusic && key !== 'bossBattle' && key !== 'finale') return;
        if (currentMusicKey === key) return;
        if (currentMusicKey && musicEls[currentMusicKey]) {
            musicEls[currentMusicKey].pause();
            musicEls[currentMusicKey].currentTime = 0;
        }
        currentMusicKey = key;
        const el = musicEls[key];
        if (el) el.play().catch(() => {}); // el autoplay puede bloquearse hasta el primer gesto
    }

    function lockFinalMusic() {
        musicLocked = false;   // permitir un último cambio...
        playMusic('finale');
        musicLocked = true;    // ...y ya no volver a cambiar nunca más
    }

    function resumeMapMusic() {
        if (mapId === 'floor2_hub' || mapId.startsWith('boss_')) playMusic('sanctum');
        else playMusic('ambient');
    }

    // ──────────────── Lore / narrativa ────────────────
    const INTRO_LINES = [
        '* Hace mucho tiempo, el CONOCIMIENTO despertó...',
        '* ...y tomó forma propia en los GUARDIANES:',
        '* espíritus de las 4 materias, protectores de',
        '* todo lo que la humanidad ha aprendido.',
        '* Con el paso de los siglos, el desinterés',
        '* y el olvido los fueron corrompiendo.',
        '* Erráticos, vagaron por el mundo entero...',
        '* ...durante mucho, mucho tiempo.',
        '* Hasta que encontraron RameTale Academy.',
        '* Allí decidieron quedarse a esperar...',
        '* ...a alguien con suficiente DETERMINACIÓN',
        '* como para derrotarlos y recordarles',
        '* el valor de lo que una vez protegieron.',
        '* Hoy es tu primer día en RameTale Academy.'
    ];
    const ENDING_LINES = [
        '* Los cuatro guardianes de RameTale Academy',
        '* han vuelto a la calma gracias a ti.',
        '* Las Matemáticas, el Lenguaje, la Historia y la Ciencia',
        '* ya no son enemigos... son tus aliados.',
        '* Tu DETERMINACIÓN ha traído equilibrio al conocimiento.',
        '* — FIN —',
        '* (¡Gracias por jugar RameTale!)'
    ];

    const battle = {
        active:false, enemyDef:null, enemyName:'', enemyHp:0, enemyMaxHp:0, subject:'',
        phase:'MENU', menuIndex:0,
        message:'', msgTimer:0, msgCb:null,
        atkPos:0, atkDir:1,
        questions:[], qIndex:0, qSelected:0, wrongCount:0, qFeedback:'',
        dodgeTimer:0, heart:{ x:0.5, y:0.5 }, bullets:[], hitCooldown:0, atk:null, grace:0, forceAttack:null
    };

    // Título
    let titleTime = 0;

    // ──────────────── Utilidades ────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }

    function parseTiles(rows) {
        return rows.map(r => [...r].map(c => TILE_CHARS[c] ?? FLOOR));
    }

    // ──────────────── Cargar mapa ────────────────
    function loadMap(id, px, py) {
        const m   = MAPS[id];
        mapId     = id;
        mapName   = m.name;
        theme     = THEMES[m.theme];
        tiles     = parseTiles(m.tiles);
        mapH      = tiles.length;
        mapW      = tiles[0].length;
        transitions = m.transitions || [];
        npcs      = (m.npcs || [])
            .filter(n => !(n.type === 'enemy' && defeatedIds[n.id]))
            .map(n => ({ ...n }));
        if (CLASSROOM_IDS.includes(id)) visitedRooms.add(id);
        resumeMapMusic();
        player.x  = px * TILE + TILE / 2;
        player.y  = py * TILE + TILE / 2;
        doorLock = { x: Math.floor(player.x / TILE), y: Math.floor(player.y / TILE) };
        player.moving = false;
        player.animTimer = 0;
        roomNameTimer = 3;
        updateCamera(true);
    }

    // ──────────────── Colisiones ────────────────
    function isSolid(tx, ty) {
        if (tx < 0 || ty < 0 || tx >= mapW || ty >= mapH) return true;
        return SOLID_SET.has(tiles[ty][tx]);
    }

    function npcAt(tx, ty) {
        return npcs.some(n => n.tx === tx && n.ty === ty);
    }

    function canMove(x, y) {
        const l = Math.floor((x - PW) / TILE);
        const r = Math.floor((x + PW - 1) / TILE);
        const t = Math.floor((y - PH) / TILE);
        const b = Math.floor((y + PH - 1) / TILE);
        if (dev.noclip) return l >= 0 && t >= 0 && r < mapW && b < mapH;   // DEV: atravesar paredes
        for (let ty = t; ty <= b; ty++)
            for (let tx = l; tx <= r; tx++)
                if (isSolid(tx, ty) || npcAt(tx, ty)) return false;
        return true;
    }

    // ──────────────── Actualizar jugador ────────────────
    function updatePlayer(dt) {
        const L = !!(keys.ArrowLeft  || keys.KeyA);
        const R = !!(keys.ArrowRight || keys.KeyD);
        const U = !!(keys.ArrowUp    || keys.KeyW);
        const D = !!(keys.ArrowDown  || keys.KeyS);
        let dx = (R ? 1 : 0) - (L ? 1 : 0);   // izquierda + derecha se anulan
        let dy = (D ? 1 : 0) - (U ? 1 : 0);

        // El sprite sigue a la ÚLTIMA dirección presionada que siga activa
        const held = dirStack.filter(dirStillHeld);
        if (held.length) player.dir = held[held.length - 1];

        if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }

        const s  = SPEED * dev.speed * dt;
        const nx = player.x + dx * s;
        const ny = player.y + dy * s;
        if (dx && canMove(nx, player.y)) player.x = nx;
        if (dy && canMove(player.x, ny)) player.y = ny;

        player.moving = (dx !== 0 || dy !== 0);
        if (player.moving) player.animTimer += dt * ANIM_SPEED;
        else               player.animTimer = 0;
        player.frame = Math.floor(player.animTimer) % 12;
    }

    // ──────────────── Puertas ────────────────
    function checkDoors() {
        const tx = Math.floor(player.x / TILE);
        const ty = Math.floor(player.y / TILE);
        if (doorLock) {
            if (tx === doorLock.x && ty === doorLock.y) return;  // aún estás en la casilla de llegada
            doorLock = null;
        }
        for (const t of transitions) {
            if (tx === t.x && ty === t.y) {
                if (t.map === 'floor2_hub' && !allSeals()) {
                    dlg.active  = true;
                    dlg.speaker = '';
                    dlg.lines   = [
                        '* La escalera está sellada por una energía extraña.',
                        `* Faltan SELLOS: tienes ${seals.size} de 4.`,
                        '* Derrota al jefe de cada ala del colegio para obtenerlos.'
                    ];
                    dlg.li = 0; dlg.ci = 0; dlg.timer = 0;
                    dlg.onDone  = null;
                    state = 'DIALOG';
                    return;
                }
                startFade(() => loadMap(t.map, t.sx, t.sy));
                return;
            }
        }
    }

    // ──────────────── Interacción NPC ────────────────
    function checkInteract() {
        const tx = Math.floor(player.x / TILE);
        const ty = Math.floor(player.y / TILE);
        let fx = tx, fy = ty;
        if (player.dir === 0) fy--;
        if (player.dir === 1) fy++;
        if (player.dir === 2) fx--;
        if (player.dir === 3) fx++;

        for (const n of npcs) {
            if (n.tx === fx && n.ty === fy) {
                if (n.type === 'enemy') {
                    startBattle(n);
                } else {
                    const useAfter = n.relatedEnemy && defeatedIds[n.relatedEnemy] && n.dialogAfter;
                    dlg.active  = true;
                    dlg.speaker = n.name;
                    dlg.lines   = useAfter ? n.dialogAfter : n.dialog;
                    dlg.li = 0; dlg.ci = 0; dlg.timer = 0;
                    dlg.onDone  = n.heal ? () => { player.hp = player.maxHp; state = 'EXPLORE'; } : null;
                    state = 'DIALOG';
                }
                return;
            }
        }
    }

    // ──────────────── Narrativa (intro / final) ────────────────
    function startIntro() {
        dlg.active  = true;
        dlg.speaker = '';
        dlg.lines   = INTRO_LINES;
        dlg.li = 0; dlg.ci = 0; dlg.timer = 0;
        dlg.onDone  = () => { state = 'TITLE'; playMusic('start'); };
        state = 'NARRATION';
        playMusic('intro');
    }

    function startEnding() {
        dlg.active  = true;
        dlg.speaker = '';
        dlg.lines   = ENDING_LINES;
        dlg.li = 0; dlg.ci = 0; dlg.timer = 0;
        dlg.onDone  = () => { state = 'CREDITS'; };
        state = 'NARRATION';
        lockFinalMusic();
    }

    // ════════════════ SISTEMA DE COMBATE ════════════════

    function startBattle(enemyDef) {
        battle.active     = true;
        battle.enemyDef    = enemyDef;
        battle.enemyName  = enemyDef.name;
        battle.enemyMaxHp = enemyDef.hp;
        battle.enemyHp    = enemyDef.hp;
        battle.subject    = enemyDef.subject;
        battle.questions  = enemyDef.questions || pickQuestions(enemyDef);
        battle.qIndex     = 0;
        battle.wrongCount = 0;
        battle.lastAtk    = null;
        battle.menuIndex  = 0;
        battle.message    = enemyDef.boss
            ? `¡El GUARDIÁN ${enemyDef.name} despierta ante ti!`
            : enemyDef.mini
            ? `¡${enemyDef.name}, JEFE del ala de ${SUBJECT_NAMES[enemyDef.subject]}, te desafía!`
            : `¡${enemyDef.name} te reta a un duelo de ${SUBJECT_NAMES[enemyDef.subject]}!`;
        battle.msgTimer   = 0;
        battle.phase      = 'MESSAGE';
        battle.msgCb      = () => { battle.phase = 'MENU'; };
        state = 'BATTLE';
        if (enemyDef.boss) guardianMusic = true;
        playMusic(enemyDef.boss ? 'bossBattle' : 'battle');
    }

    function endBattle(won, fled) {
        let sealMsg = null;
        if (won) {
            defeatedIds[battle.enemyDef.id] = true;
            npcs = npcs.filter(n => n !== battle.enemyDef);
            if (battle.enemyDef.seal && !seals.has(battle.enemyDef.seal)) { seals.add(battle.enemyDef.seal); sealMsg = battle.enemyDef.seal; }
        } else if (!fled) {
            // Se acabó el HP: recuperación completa, el enemigo sigue ahí
            player.hp = player.maxHp;
        }
        battle.active = false;
        state = 'EXPLORE';
        if (!(won && allDefeated())) resumeMapMusic();
        if (sealMsg) {
            dlg.active = true; dlg.speaker = '';
            dlg.lines = [`* ¡Obtuviste el SELLO ${SEAL_NAMES[sealMsg]}!`,
                         seals.size >= 4 ? '* ¡Tienes los 4 SELLOS! La escalera de los Guardianes se abrió.'
                                         : `* Tienes ${seals.size} de 4 SELLOS.`];
            dlg.li = 0; dlg.ci = 0; dlg.timer = 0; dlg.onDone = null;
            state = 'DIALOG';
        }
    }

    function triggerGameOver() {
        battle.message = '¡Te has quedado sin HP!';
        battle.msgTimer = 0;
        battle.phase = 'GAME_OVER';
    }

    function startAttack() {
        battle.phase  = 'ATTACK_BAR';
        battle.atkPos = 0;
        battle.atkDir = 1;
    }

    function updateAttackBar(dt) {
        battle.atkPos += battle.atkDir * dt * 1.6;
        if (battle.atkPos >= 1) { battle.atkPos = 1; battle.atkDir = -1; }
        if (battle.atkPos <= 0) { battle.atkPos = 0; battle.atkDir = 1; }

        if (interact) {
            const dist = Math.abs(battle.atkPos - 0.5) * 2; // 0=centro, 1=extremo
            const dmg  = Math.round(28 - dist * 20);
            battle.enemyHp = Math.max(0, battle.enemyHp - dmg);
            battle.message  = dist < 0.15 ? `¡Golpe crítico! -${dmg} HP` : `¡Atacaste! -${dmg} HP`;
            battle.msgTimer = 0;
            battle.phase = 'MESSAGE';
            battle.msgCb = () => {
                if (battle.enemyHp <= 0) startVictory();
                else startEnemyTurn();
            };
        }
    }

    function startQuiz() {
        battle.qIndex     = 0;
        battle.wrongCount = 0;
        battle.qSelected  = 0;
        battle.phase      = 'QUIZ_QUESTION';
    }

    function updateQuizQuestion() {
        const q = battle.questions[battle.qIndex];
        if (navUp)   battle.qSelected = (battle.qSelected + q.options.length - 1) % q.options.length;
        if (navDown) battle.qSelected = (battle.qSelected + 1) % q.options.length;
        if (interact) {
            const correct = battle.qSelected === q.correct;
            if (!correct) battle.wrongCount++;
            battle.qFeedback = correct ? '¡Correcto!' : `Incorrecto. Era: ${q.options[q.correct]}`;
            battle.phase = 'QUIZ_FEEDBACK';
        }
    }

    function advanceQuiz() {
        battle.qIndex++;
        if (battle.qIndex >= battle.questions.length) {
            finishQuiz();
        } else {
            battle.qSelected = 0;
            battle.phase = 'QUIZ_QUESTION';
        }
    }

    function finishQuiz() {
        if (battle.wrongCount === 0) {
            battle.enemyHp  = 0;
            battle.message  = '¡Respondiste todo bien! ¡El enemigo se rinde!';
            battle.phase    = 'MESSAGE';
            battle.msgCb    = () => startVictory();
        } else {
            const dmg = WRONG_DMG_TABLE[Math.min(battle.wrongCount, WRONG_DMG_TABLE.length - 1)];
            if (!dev.god) player.hp = Math.max(0, player.hp - dmg);
            battle.message = `Fallaste ${battle.wrongCount} pregunta(s). ¡Pierdes ${dmg} HP!`;
            battle.phase   = 'MESSAGE';
            battle.msgCb   = () => {
                if (player.hp <= 0) triggerGameOver();
                else startEnemyTurn();
            };
        }
    }

    function useItem() {
        const heal = Math.min(ITEM_HEAL, player.maxHp - player.hp);
        player.hp += heal;
        battle.message = heal > 0 ? `Comiste un sándwich. +${heal} HP` : 'Ya estás al máximo de HP.';
        battle.phase   = 'MESSAGE';
        battle.msgCb   = () => startEnemyTurn();
    }

    function tryMercy() {
        battle.message = `Intentas huir de ${battle.enemyName}... ¡Escapaste!`;
        battle.phase   = 'MESSAGE';
        battle.msgCb   = () => endBattle(false, true);
    }

    function startVictory() {
        battle.message = `¡Has derrotado a ${battle.enemyName}!`;
        battle.phase   = 'VICTORY';
    }

    function startEnemyTurn() {
        const def  = battle.enemyDef || {};
        const boss = !!(def.boss || def.hard);
        battle.phase      = 'ENEMY_TURN';
        battle.dodgeTimer = boss ? DODGE_TIME + 1.5 : DODGE_TIME;
        battle.hitCooldown = 0;
        battle.heart.x = 0.5; battle.heart.y = 0.5;
        const key = battle.forceAttack || pickAttack(def, battle.lastAtk);
        battle.forceAttack = null;
        battle.lastAtk = key;
        battle.atk   = ATTACKS[key](boss);
        if (def.boss && battle.atk.dmg < 10) battle.atk.dmg = 10;      // los Guardianes pegan más fuerte
        battle.grace = battle.atk.grace;     // unos instantes sin daño al empezar
    }

    // ════════════════ ATAQUES DE LOS ENEMIGOS ════════════════
    // Cada enemigo tiene su propio ataque, ligado a su materia. Se ejecutan dentro de la caja de
    // esquive (BOX_W × BOX_H px). Cada ataque es:  hard => { label, dmg, grace, update(dt,hx,hy), hit(hx,hy), draw(ctx,ox,oy) }
    //   hx, hy = posición del corazón en píxeles dentro de la caja · hard = true en los Guardianes
    const BOX_W = 200, BOX_H = 120, HEART_R = 3;
    const arnd = (a, b) => a + Math.random() * (b - a);
    const aint = (a, b) => Math.floor(arnd(a, b + 1));
    const aclamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const circHit = (x, y, r, hx, hy) => { const dx = x - hx, dy = y - hy, rr = r + HEART_R; return dx * dx + dy * dy < rr * rr; };
    const rectHit = (cx, cy, hw, hh, hx, hy) => Math.abs(hx - cx) < hw + HEART_R && Math.abs(hy - cy) < hh + HEART_R;
    function outlineText(c, str, x, y, fill) {
        c.lineWidth = 3; c.strokeStyle = '#000'; c.strokeText(str, x, y);
        c.fillStyle = fill; c.fillText(str, x, y);
    }

    const ATTACKS = {};

    // ── MATEMÁTICAS (común): símbolos matemáticos que caen y suben ──
    ATTACKS.mathRain = hard => {
        const SYM = ['+', '−', '×', '÷', '=', 'π', '√', 'Σ', '%', '∞', '7', '²'];
        const n = hard ? 12 : 9;
        const mk = down => ({
            x: arnd(10, BOX_W - 10),
            y: down ? -arnd(0, 90) : BOX_H + arnd(0, 90),
            vy: (down ? 1 : -1) * arnd(55, 85) * (hard ? 1.2 : 1),
            ch: SYM[aint(0, SYM.length - 1)], rot: arnd(-0.4, 0.4)
        });
        const items = Array.from({ length: n }, (_, i) => mk(i % 2 === 0));
        return {
            label: '¡Esquiva los símbolos!', dmg: 8, grace: 0.5,
            update(dt) {
                for (const it of items) {
                    it.y += it.vy * dt;
                    if (it.vy > 0 && it.y > BOX_H + 10) Object.assign(it, mk(true));
                    else if (it.vy < 0 && it.y < -10)   Object.assign(it, mk(false));
                }
            },
            hit: (hx, hy) => items.some(it => it.y > 0 && it.y < BOX_H && circHit(it.x, it.y, 6, hx, hy)),
            draw(c, ox, oy) {
                c.font = 'bold 17px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
                for (const it of items) {
                    c.save(); c.translate(ox + it.x, oy + it.y); c.rotate(it.rot);
                    outlineText(c, it.ch, 0, 0, it.vy > 0 ? '#8fd0ff' : '#ffd36a');
                    c.restore();
                }
            }
        };
    };

    // ── LENGUAJE (común): un lápiz que escribe renglones y deja tinta ──
    ATTACKS.pencilWrite = hard => {
        const rows = [16, 44, 72, 100], SP = hard ? 150 : 130, INK = 1.5;
        const mkPencil = (row, dir, delay) => ({ row, dir, delay, x: dir > 0 ? -12 : BOX_W + 12, y: rows[row], trail: [] });
        const pencils = [mkPencil(0, 1, 0.3)];
        if (hard) pencils.push(mkPencil(3, -1, 1.0));
        return {
            label: '¡Esquiva el lápiz y su tinta!', dmg: 8, grace: 0.5,
            update(dt) {
                for (const p of pencils) {
                    for (const q of p.trail) q.age += dt;
                    while (p.trail.length && p.trail[0].age > INK) p.trail.shift();
                    if (p.delay > 0) { p.delay -= dt; continue; }
                    p.x += p.dir * SP * dt;
                    const ty = rows[p.row] + 4 * Math.sin(p.x * 0.18);          // escritura ondulada
                    p.y += aclamp(ty - p.y, -140 * dt, 140 * dt);
                    p.trail.push({ x: p.x, y: p.y + arnd(-0.8, 0.8), age: 0 });
                    if ((p.dir > 0 && p.x > BOX_W + 14) || (p.dir < 0 && p.x < -14)) {   // fin del renglón: baja y vuelve
                        p.dir *= -1; p.row = (p.row + 1) % rows.length;
                    }
                }
            },
            hit(hx, hy) {
                for (const p of pencils) {
                    if (p.delay > 0) continue;
                    if (circHit(p.x, p.y, 6, hx, hy)) return true;
                    for (const q of p.trail) if (q.age < INK - 0.2 && circHit(q.x, q.y, 2.5, hx, hy)) return true;
                }
                return false;
            },
            draw(c, ox, oy) {
                for (const p of pencils) {
                    c.lineCap = 'round'; c.lineWidth = 3;
                    for (let i = 1; i < p.trail.length; i++) {
                        const a = p.trail[i - 1], b = p.trail[i];
                        if (Math.abs(b.x - a.x) > 12) continue;
                        c.strokeStyle = `rgba(70,90,255,${(1 - b.age / INK).toFixed(2)})`;
                        c.beginPath(); c.moveTo(ox + a.x, oy + a.y); c.lineTo(ox + b.x, oy + b.y); c.stroke();
                    }
                    if (p.delay > 0) continue;
                    c.save(); c.translate(ox + p.x, oy + p.y); if (p.dir < 0) c.scale(-1, 1);
                    c.fillStyle = '#f0c040'; c.fillRect(-16, -3, 14, 6);
                    c.fillStyle = '#bbb';    c.fillRect(-19, -3, 3, 6);
                    c.fillStyle = '#f08a9a'; c.fillRect(-23, -3, 4, 6);
                    c.fillStyle = '#e8c48a'; c.beginPath(); c.moveTo(-2, -3); c.lineTo(6, 0); c.lineTo(-2, 3); c.fill();
                    c.fillStyle = '#222';    c.beginPath(); c.moveTo(3.5, -1); c.lineTo(6, 0); c.lineTo(3.5, 1); c.fill();
                    c.restore();
                }
            }
        };
    };

    // ── HISTORIA (común): rollos de pergamino que ruedan por carriles (con aviso) ──
    ATTACKS.rollingScrolls = hard => {
        const lanes = [16, 44, 72, 100], SP = hard ? 235 : 190;
        let timer = 0.5; const warns = [], scrolls = [];
        return {
            label: '¡Esquiva los rollos!', dmg: 8, grace: 0.6,
            update(dt, t) {
                timer -= dt;
                if (timer <= 0) { timer = hard ? 0.5 : 0.65; warns.push({ lane: aint(0, 3), side: Math.random() < 0.5 ? 1 : -1, t: 0.55 }); }
                for (let i = warns.length - 1; i >= 0; i--) {
                    const w = warns[i]; w.t -= dt;
                    if (w.t <= 0) { scrolls.push({ x: w.side > 0 ? -18 : BOX_W + 18, y: lanes[w.lane], vx: w.side * SP }); warns.splice(i, 1); }
                }
                for (let i = scrolls.length - 1; i >= 0; i--) {
                    const r = scrolls[i]; r.x += r.vx * dt;
                    if (r.x < -30 || r.x > BOX_W + 30) scrolls.splice(i, 1);
                }
            },
            hit: (hx, hy) => scrolls.some(r => rectHit(r.x, r.y, 14, 9, hx, hy)),
            draw(c, ox, oy) {
                const blink = 0.5 + 0.5 * Math.sin(performance.now() / 60);
                for (const w of warns) {
                    c.fillStyle = `rgba(255,70,70,${(0.12 + 0.14 * blink).toFixed(2)})`;
                    c.fillRect(ox, oy + lanes[w.lane] - 14, BOX_W, 28);
                    c.font = 'bold 16px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
                    outlineText(c, '!', ox + (w.side > 0 ? 10 : BOX_W - 10), oy + lanes[w.lane], '#ff5a5a');
                }
                for (const r of scrolls) {
                    c.save(); c.translate(ox + r.x, oy + r.y);
                    c.fillStyle = '#ead9b0'; c.fillRect(-12, -8, 24, 16);
                    c.fillStyle = '#c49a56'; c.beginPath(); c.arc(-12, 0, 8, 0, 7); c.fill(); c.beginPath(); c.arc(12, 0, 8, 0, 7); c.fill();
                    c.strokeStyle = '#6a4a1e'; c.lineWidth = 1.5;
                    c.beginPath(); c.arc(-12, 0, 8, 0, 7); c.stroke(); c.beginPath(); c.arc(12, 0, 8, 0, 7); c.stroke();
                    const off = (r.x * 0.5) % 6;                                  // el pergamino "gira" al rodar
                    c.beginPath(); for (let k = -9; k < 12; k += 6) { c.moveTo(k + off - 3, -4); c.lineTo(k + off + 1, -4); c.moveTo(k + off - 3, 2); c.lineTo(k + off + 1, 2); } c.stroke();
                    c.restore();
                }
            }
        };
    };

    // ── CIENCIAS (común): moléculas que vibran y rebotan por todos lados ──
    ATTACKS.bouncingMolecules = hard => {
        const n = hard ? 10 : 8, COL = ['#c070ff', '#5fe0a0', '#ff9a60'];
        const balls = [];
        while (balls.length < n) {
            const x = arnd(8, BOX_W - 8), y = arnd(8, BOX_H - 8);
            if (Math.hypot(x - BOX_W / 2, y - BOX_H / 2) < 48) continue;         // lejos del corazón al inicio
            const a = arnd(0, 6.283), sp = arnd(45, 85);
            balls.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, jit: arnd(0, 0.2), ph: arnd(0, 6), c: COL[balls.length % 3] });
        }
        return {
            label: '¡Esquiva las moléculas!', dmg: 8, grace: 0.6,
            update(dt) {
                for (const b of balls) {
                    b.jit -= dt; b.ph += dt * 32;
                    if (b.jit <= 0) {                                                // sacudida aleatoria (vibran)
                        b.jit = arnd(0.08, 0.22); b.vx += arnd(-32, 32); b.vy += arnd(-32, 32);
                        const sp = Math.hypot(b.vx, b.vy), k = aclamp(sp, 40, 100) / (sp || 1); b.vx *= k; b.vy *= k;
                    }
                    b.x += b.vx * dt; b.y += b.vy * dt;
                    if (b.x < 5)           { b.x = 5;           b.vx =  Math.abs(b.vx); }
                    if (b.x > BOX_W - 5)   { b.x = BOX_W - 5;   b.vx = -Math.abs(b.vx); }
                    if (b.y < 5)           { b.y = 5;           b.vy =  Math.abs(b.vy); }
                    if (b.y > BOX_H - 5)   { b.y = BOX_H - 5;   b.vy = -Math.abs(b.vy); }
                }
            },
            hit: (hx, hy) => balls.some(b => circHit(b.x, b.y, 5, hx, hy)),
            draw(c, ox, oy) {
                for (const b of balls) {
                    const x = ox + b.x + Math.sin(b.ph) * 1.4, y = oy + b.y + Math.cos(b.ph * 1.3) * 1.4;
                    c.fillStyle = b.c; c.strokeStyle = '#1a0a2a'; c.lineWidth = 1.5;
                    c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.fill(); c.stroke();
                    c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.arc(x - 1.8, y - 1.8, 1.6, 0, 7); c.fill();
                }
            }
        };
    };

    // ── MATEMÁTICAS (jefe): rayos de ecuación avisados en filas y columnas ──
    ATTACKS.equationBeams = hard => {
        const TH = 16; let timer = 0.4; const beams = [];
        return {
            label: '¡Esquiva los rayos de la ecuación!', dmg: 10, grace: 0.5,
            update(dt, t, hx, hy) {
                timer -= dt;
                if (timer <= 0) {
                    timer = hard ? 0.62 : 0.9;
                    const cnt = (hard && Math.random() < 0.5) ? 2 : 1;
                    for (let i = 0; i < cnt; i++) {
                        const h = Math.random() < 0.5, aim = Math.random() < 0.65;
                        const pos = h ? aclamp(aim ? hy + arnd(-14, 14) : arnd(10, BOX_H - 10), 9, BOX_H - 9)
                                      : aclamp(aim ? hx + arnd(-20, 20) : arnd(10, BOX_W - 10), 9, BOX_W - 9);
                        beams.push({ h, pos, warn: 0.65, fire: 0.28 });
                    }
                }
                for (let i = beams.length - 1; i >= 0; i--) {
                    const b = beams[i];
                    if (b.warn > 0) b.warn -= dt; else b.fire -= dt;
                    if (b.fire <= 0) beams.splice(i, 1);
                }
            },
            hit: (hx, hy) => beams.some(b => b.warn <= 0 && b.fire > 0 && Math.abs((b.h ? hy : hx) - b.pos) < TH / 2 + HEART_R),
            draw(c, ox, oy) {
                c.font = 'bold 12px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
                for (const b of beams) {
                    const x = b.h ? ox : ox + b.pos - TH / 2, y = b.h ? oy + b.pos - TH / 2 : oy;
                    const w = b.h ? BOX_W : TH, h = b.h ? TH : BOX_H;
                    if (b.warn > 0) {
                        const bl = Math.floor(b.warn * 14) % 2;
                        c.strokeStyle = bl ? '#ffe070' : '#ff9a40'; c.lineWidth = 1.5; c.setLineDash([5, 4]);
                        c.strokeRect(x + .5, y + .5, w - 1, h - 1); c.setLineDash([]);
                        outlineText(c, '=', b.h ? ox + 10 : ox + b.pos, b.h ? oy + b.pos : oy + 10, '#ffe070');
                    } else {
                        c.fillStyle = '#2a6aff'; c.fillRect(x, y, w, h);
                        c.fillStyle = '#cfe8ff'; if (b.h) c.fillRect(x, y + 4, w, h - 8); else c.fillRect(x + 4, y, w - 8, h);
                        c.fillStyle = '#fff';    if (b.h) c.fillRect(x, y + 6, w, h - 12); else c.fillRect(x + 6, y, w - 12, h);
                    }
                }
            }
        };
    };

    // ── LENGUAJE (jefe): olas de letras que cruzan en zigzag ──
    ATTACKS.letterWaves = hard => {
        const WORDS = ['VERBO', 'ERROR', 'TILDE', 'PUNTO', 'COMA', 'SINTAXIS'];
        const SP = hard ? 105 : 92; let timer = 0.2; const L = [];
        return {
            label: '¡Esquiva las palabras!', dmg: 10, grace: 0.5,
            update(dt) {
                timer -= dt;
                if (timer <= 0) {
                    timer = hard ? 0.95 : 1.15;
                    const word = WORDS[aint(0, WORDS.length - 2)], base = arnd(24, 96), amp = arnd(10, 22), ph = arnd(0, 6);
                    for (let i = 0; i < word.length; i++) L.push({ x: BOX_W + 12 + i * 15, base, amp, ph, ch: word[i], y: base });
                }
                for (let i = L.length - 1; i >= 0; i--) {
                    const l = L[i]; l.x -= SP * dt;
                    l.y = aclamp(l.base + l.amp * Math.sin(l.x * 0.05 + l.ph), 8, BOX_H - 8);
                    if (l.x < -14) L.splice(i, 1);
                }
            },
            hit: (hx, hy) => L.some(l => l.x > 0 && l.x < BOX_W && circHit(l.x, l.y, 6.5, hx, hy)),
            draw(c, ox, oy) {
                c.font = 'bold 16px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
                for (const l of L) outlineText(c, l.ch, ox + l.x, oy + l.y, '#ff6a6a');
            }
        };
    };

    // ── HISTORIA (jefe): un dinosaurio embiste el corazón + meteoritos ──
    function drawDino(c, x, y, dir, step) {
        c.save(); c.translate(x, y); if (dir < 0) c.scale(-1, 1);
        c.fillStyle = '#6f9a3a'; c.strokeStyle = '#1b2a0c'; c.lineWidth = 1.5;
        const leg = step % 2 ? 3 : 0;
        c.fillRect(-8, 5, 5, 7 + leg); c.fillRect(3, 5, 5, 10 - leg);                      // patas
        c.beginPath(); c.moveTo(-12, -2); c.lineTo(-26, -8); c.lineTo(-12, 7); c.closePath(); c.fill(); c.stroke();   // cola
        c.beginPath(); c.ellipse(0, 0, 14, 9, 0, 0, 7); c.fill(); c.stroke();               // cuerpo
        c.fillRect(8, -16, 15, 11); c.strokeRect(8, -16, 15, 11);                           // cabeza
        c.fillStyle = '#fff'; c.fillRect(21, -8, 2, 3); c.fillRect(17, -8, 2, 3);           // dientes
        c.fillStyle = '#ffe070'; c.fillRect(15, -14, 3, 3); c.fillStyle = '#000'; c.fillRect(16, -13, 1, 1);   // ojo
        c.fillStyle = '#6f9a3a'; c.fillRect(7, 0, 5, 2);                                    // bracito
        c.restore();
    }
    ATTACKS.dinoCharge = hard => {
        let tD = 0.5, tM = 1.0, clock = 0; const warns = [], dinos = [], rocks = [];
        return {
            label: '¡Esquiva al dinosaurio!', dmg: 10, grace: 0.5,
            update(dt, t, hx, hy) {
                clock += dt;
                tD -= dt;
                if (tD <= 0) { tD = hard ? 1.45 : 1.7; warns.push({ y: aclamp(hy + arnd(-8, 8), 16, BOX_H - 16), side: Math.random() < 0.5 ? 1 : -1, t: 0.7 }); }
                for (let i = warns.length - 1; i >= 0; i--) {
                    const w = warns[i]; w.t -= dt;
                    if (w.t <= 0) { dinos.push({ x: w.side > 0 ? -30 : BOX_W + 30, y: w.y, vx: w.side * (hard ? 300 : 260) }); warns.splice(i, 1); }
                }
                for (let i = dinos.length - 1; i >= 0; i--) { const d = dinos[i]; d.x += d.vx * dt; if (d.x < -50 || d.x > BOX_W + 50) dinos.splice(i, 1); }
                tM -= dt;
                if (tM <= 0) { tM = arnd(0.7, 1.1); rocks.push({ x: arnd(30, BOX_W + 40), y: -8, vx: -45, vy: arnd(85, 120) }); }
                for (let i = rocks.length - 1; i >= 0; i--) { const r = rocks[i]; r.x += r.vx * dt; r.y += r.vy * dt; if (r.y > BOX_H + 10 || r.x < -10) rocks.splice(i, 1); }
            },
            hit: (hx, hy) => dinos.some(d => rectHit(d.x, d.y - 2, 19, 11, hx, hy)) || rocks.some(r => circHit(r.x, r.y, 5, hx, hy)),
            draw(c, ox, oy) {
                const blink = 0.5 + 0.5 * Math.sin(performance.now() / 55);
                for (const w of warns) {

                for (const d of dinos) drawDino(c, ox + d.x, oy + d.y, Math.sign(d.vx), Math.floor(clock * 14));

                    c.strokeStyle = 'rgba(255,170,60,0.55)'; c.lineWidth = 3;
                    c.beginPath(); c.moveTo(ox + r.x, oy + r.y); c.lineTo(ox + r.x - r.vx * 0.12, oy + r.y - r.vy * 0.12); c.stroke();
                    c.fillStyle = '#8a5a3a'; c.strokeStyle = '#2a1408'; c.lineWidth = 1.5;

    // ── CIENCIAS (jefe): un átomo con electrones orbitando que se acerca y se aleja ──
    ATTACKS.atomOrbit = hard => {
        let t = 0;
        const rings = [{ r: 22, n: 3, w: 2.4 }, { r: 46, n: hard ? 5 : 4, w: -1.7 }];
        const nuc = { x: 0, y: 0 }, els = [];
        function layout() {
            const s = Math.min(1, t / 1.1);                                       // los anillos se expanden al inicio

            nuc.y = BOX_H / 2 + 24 * Math.sin(1.1 * t);
            els.length = 0;
            rings.forEach((rg, ri) => {
                for (let k = 0; k < rg.n; k++) {
                    const a = rg.w * t + (k * 6.2832) / rg.n, rad = rg.r * s * (1 + 0.1 * Math.sin(3 * t + ri));
                    els.push({ x: nuc.x + Math.cos(a) * rad, y: nuc.y + Math.sin(a) * rad });
                }
            });

        layout();
        return {
            label: '¡Esquiva los electrones!', dmg: 10, grace: 1.0,
            update(dt) { t += dt; layout(); },
            hit: (hx, hy) => circHit(nuc.x, nuc.y, 8, hx, hy) || els.some(e => circHit(e.x, e.y, 5.5, hx, hy)),
            draw(c, ox, oy) {
                const s = Math.min(1, t / 1.1);
                c.strokeStyle = 'rgba(190,130,255,0.35)'; c.lineWidth = 1;
                for (const rg of rings) { c.beginPath(); c.arc(ox + nuc.x, oy + nuc.y, rg.r * s, 0, 7); c.stroke(); }
                for (const e of els) {
                    c.fillStyle = 'rgba(255,224,112,0.3)'; c.beginPath(); c.arc(ox + e.x, oy + e.y, 8, 0, 7); c.fill();
                    c.fillStyle = '#ffe070'; c.strokeStyle = '#4a3a08'; c.lineWidth = 1.5;
                    c.beginPath(); c.arc(ox + e.x, oy + e.y, 5, 0, 7); c.fill(); c.stroke();
                }
                c.fillStyle = '#8a3ac0'; c.strokeStyle = '#1a0630'; c.lineWidth = 2;
                c.beginPath(); c.arc(ox + nuc.x, oy + nuc.y, 8, 0, 7); c.fill(); c.stroke();
                c.fillStyle = '#d8a8ff'; c.beginPath(); c.arc(ox + nuc.x - 2.5, oy + nuc.y - 2.5, 2.2, 0, 7); c.fill();
            }
        };
    };

    // ════════════════ ATAQUES NUEVOS (3 más por materia) ════════════════
    const segDist = (px, py, x1, y1, x2, y2) => {
        const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
        let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    };
    const segHit = (x1, y1, x2, y2, r, hx, hy) => segDist(hx, hy, x1, y1, x2, y2) < r + HEART_R;
    const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
    function line(c, ox, oy, x1, y1, x2, y2) { c.beginPath(); c.moveTo(ox + x1, oy + y1); c.lineTo(ox + x2, oy + y2); c.stroke(); }

        const piv = [{ x:48, y:34, dir:1, a:Math.PI * 0.9 }, { x:152, y:86, dir:-1, a:Math.PI * 0.1 }];
        const tip = p => ({ x: p.x + Math.cos(p.a) * L, y: p.y + Math.sin(p.a) * L });
        return {
            label: '¡Esquiva el compás!', dmg: 8, grace: 0.7,
            update(dt) { for (const p of piv) p.a += p.dir * W * dt; },
            hit: (hx, hy) => piv.some(p => { const e = tip(p); return segHit(p.x, p.y, e.x, e.y, 2.5, hx, hy) || circHit(p.x, p.y, 6, hx, hy); }),
            draw(c, ox, oy) {
                for (const p of piv) {
                    const e = tip(p);
                    c.strokeStyle = 'rgba(160,200,255,0.18)'; c.lineWidth = 1; c.setLineDash([3, 4]);
                    c.beginPath(); c.arc(ox + p.x, oy + p.y, L, 0, 7); c.stroke(); c.setLineDash([]);
                    c.lineCap = 'round';
                    c.strokeStyle = '#1c1c28'; c.lineWidth = 7; line(c, ox, oy, p.x, p.y, e.x, e.y);
                    c.strokeStyle = '#b8bece'; c.lineWidth = 4; line(c, ox, oy, p.x, p.y, e.x, e.y);
                    c.fillStyle = '#d83a3a'; c.beginPath(); c.arc(ox + e.x, oy + e.y, 3, 0, 7); c.fill();
                    c.fillStyle = '#e6b422'; c.strokeStyle = '#3a2a08'; c.lineWidth = 1.5;
                    c.beginPath(); c.arc(ox + p.x, oy + p.y, 6, 0, 7); c.fill(); c.stroke();
                }
            }
        };
    };

    // Círculos que se expanden con una abertura por donde se puede pasar
    ATTACKS.circleWaves = hard => {

        let timer = 0.3; const rings = [];
        const inGap = (g, hx, hy) => Math.abs(angDiff(Math.atan2(hy - g.y, hx - g.x), g.gap)) < g.gw / 2;
        return {
            label: '¡Esquiva los círculos!', dmg: 8, grace: 0.5,

                if (timer <= 0 && rings.length < 3) {

                for (let i = rings.length - 1; i >= 0; i--) {

                    c.beginPath(); c.arc(ox + g.x, oy + g.y, g.r, g.gap + g.gw / 2, g.gap + Math.PI * 2 - g.gw / 2); c.stroke();

            }
        };
    };

    // Una tabla de 5×3 casillas: algunas parpadean en amarillo y luego explotan
    ATTACKS.gridFlash = hard => {

                for (const k of cells) {
                    const x = ox + k.col * CWd, y = oy + k.row * CHd;
                    if (k.warn > 0) {
                        const bl = Math.floor(k.warn * 12) % 2;
                        c.fillStyle = bl ? 'rgba(255,224,80,0.32)' : 'rgba(255,170,60,0.22)'; c.fillRect(x + 1, y + 1, CWd - 2, CHd - 2);
                        c.strokeStyle = '#ffe070'; c.lineWidth = 1.5; c.strokeRect(x + 2, y + 2, CWd - 4, CHd - 4);
                        outlineText(c, k.ch, x + CWd / 2, y + CHd / 2, '#ffe070');
                    } else {
                        c.fillStyle = '#e83a3a'; c.fillRect(x + 1, y + 1, CWd - 2, CHd - 2);
                        c.fillStyle = '#ffd0d0'; c.fillRect(x + 6, y + 6, CWd - 12, CHd - 12);
                        outlineText(c, k.ch, x + CWd / 2, y + CHd / 2, '#ffffff');
                    }
                }
            }
        };
    };

    // Una serpiente de letras que persigue al corazón
    ATTACKS.wordSnake = hard => {
        const WORDS = ['ADJETIVO', 'SUJETO', 'ORACION', 'PUNTO', 'VERBO', 'SUFIJO'];
        const word = WORDS[aint(0, WORDS.length - 1)], SPEED = hard ? 72 : 58, GAP = 11;
        const seg = Array.from({ length: word.length }, (_, i) => ({ x: BOX_W + 14 + i * GAP, y: arnd(25, 95), ch: word[i] }));
        let vx = -1, vy = 0;
        return {
            label: '¡Esquiva la serpiente de letras!', dmg: 8, grace: 0.5,
            update(dt, t, hx, hy) {
                const h = seg[0];
                let dx = hx - h.x, dy = hy - h.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
                const k = Math.min(1, 2.4 * dt);
                vx += (dx - vx) * k; vy += (dy - vy) * k;
                const m = Math.hypot(vx, vy) || 1; vx /= m; vy /= m;
                h.x += vx * SPEED * dt; h.y += vy * SPEED * dt;
                for (let i = 1; i < seg.length; i++) {
                    const p = seg[i - 1], s = seg[i];
                    const ex = s.x - p.x, ey = s.y - p.y, l = Math.hypot(ex, ey) || 1;
                    s.x = p.x + ex / l * GAP; s.y = p.y + ey / l * GAP;
                }
            },
            hit: (hx, hy) => seg.some((s, i) => s.x > -2 && s.x < BOX_W + 2 && circHit(s.x, s.y, i === 0 ? 6 : 5, hx, hy)),
            draw(c, ox, oy) {
                c.textAlign = 'center'; c.textBaseline = 'middle';
                for (let i = seg.length - 1; i >= 0; i--) {
                    const s = seg[i];
                    c.font = (i === 0 ? 'bold 19px' : 'bold 15px') + ' monospace';
                    outlineText(c, s.ch, ox + s.x, oy + s.y, i === 0 ? '#ff4a4a' : '#ffb0b0');
                }
            }
        };
    };

                        c.fillStyle = '#c8c8d4'; c.beginPath(); c.moveTo(ox + m.x, tipY + 4); c.lineTo(ox + m.x - 4, tipY - 3); c.lineTo(ox + m.x + 4, tipY - 3); c.fill();
                        c.fillStyle = '#d8403a'; c.fillRect(ox + m.x - 4, tipY - 20, 3, 6); c.fillRect(ox + m.x + 1, tipY - 20, 3, 6);

    // Tres péndulos con hacha que se balancean desde el techo
    ATTACKS.pendulums = hard => {
        const AMP = 0.95;
        const P = [{ x:34, len:100, per:1.7, ph:2.2 }, { x:100, len:104, per:hard ? 1.8 : 2.1, ph:-1.0 }, { x:166, len:98, per:1.5, ph:0.5 }];

            label: '¡Esquiva los péndulos!', dmg: 8, grace: 0.6,
            update(dt) { t += dt; },
            hit: (hx, hy) => P.some(p => { const b = bob(p); return circHit(b.x, b.y, 9, hx, hy) || segHit(p.x, 0, b.x, b.y, 1.8, hx, hy); }),
            draw(c, ox, oy) {
                for (const p of P) {
                    const b = bob(p);
                    c.strokeStyle = '#2a2a34'; c.lineWidth = 4; line(c, ox, oy, p.x, 0, b.x, b.y);
                    c.strokeStyle = '#9a9aa8'; c.lineWidth = 2; line(c, ox, oy, p.x, 0, b.x, b.y);
                    c.fillStyle = '#e6b422'; c.beginPath(); c.arc(ox + p.x, oy, 4, 0, 7); c.fill();
                    c.save(); c.translate(ox + b.x, oy + b.y); c.rotate(-b.a);
                    c.fillStyle = '#b8b8c8'; c.strokeStyle = '#1c1c28'; c.lineWidth = 1.5;
                    c.beginPath(); c.moveTo(-10, -2); c.quadraticCurveTo(-4, -12, 10, -2); c.quadraticCurveTo(-4, 12, -10, -2); c.fill(); c.stroke();
                    c.fillStyle = '#7a5230'; c.fillRect(-1.5, -9, 3, 5);
                    c.restore();
                }
